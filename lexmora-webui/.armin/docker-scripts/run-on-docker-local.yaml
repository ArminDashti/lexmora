# Local deploy settings - scripts read this file only (no CLI -- flags).
# Non-empty override fields replace values from compose_file / dockerfile.

stack_name: lexmora
image_tag: lexmora-webui:latest
compose_file: ../../docker-compose.yml
dockerfile: ../../Dockerfile
docker_network: t3-net
api_host: lexmora-api
api_port: "8080"
internal_port: "80"
publish_port: "8090"
delete_volume: "no"
delete_image: "yes"
