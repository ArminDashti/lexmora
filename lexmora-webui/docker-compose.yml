name: lexmora

services:
  lexmora-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_TAG:-lexmora-webui:latest}
    container_name: lexmora-webui
    expose:
      - "80"
    environment:
      API_HOST: ${API_HOST:-lexmora-api}
      API_PORT: ${API_PORT:-8080}
    volumes:
      - lexmora-webui-vol:/data
    networks:
      - t3-net
    restart: "no"

networks:
  t3-net:
    name: ${DOCKER_NETWORK:-t3-net}
    external: true

volumes:
  lexmora-webui-vol:
    name: lexmora-webui-vol
